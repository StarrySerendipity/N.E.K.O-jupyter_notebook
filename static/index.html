<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N.E.K.O 笔记本</title>
  <link rel="stylesheet" href="http://127.0.0.1:48915/static/css/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="jp-bg-layer" aria-hidden="true"></div>
  <div class="jp-shell">
    <nav class="jp-menubar" aria-label="笔记本菜单">
      <button class="jp-menu-item" data-menu="文件">文件</button>
      <button class="jp-menu-item" data-menu="编辑">编辑</button>
      <button class="jp-menu-item" data-menu="查看">查看</button>
      <button class="jp-menu-item" data-menu="运行">运行</button>
      <button class="jp-menu-item" data-menu="内核">内核</button>
      <button class="jp-menu-item" data-menu="设置">设置</button>
      <button class="jp-menu-item" data-menu="帮助">帮助</button>
      <div class="jp-menubar-spacer"></div>
      <div id="runtime-state" class="jp-runtime-state">运行时检查中</div>
      <div id="kernel-state" class="jp-kernel-state">内核检查中</div>
    </nav>
    <div id="menu-panel" class="jp-menu-panel hidden" role="menu" aria-label="菜单面板"></div>

    <section class="jp-toolbar" aria-label="笔记本工具栏">
      <div class="jp-toolbar-group mobile-collapsible">
        <button id="save-btn" class="jp-toolbar-btn" title="保存">💾</button>
        <button id="new-notebook-btn" class="jp-toolbar-btn" title="新建笔记本">＋</button>
        <button id="refresh-list-btn" class="jp-toolbar-btn" title="刷新列表">↻</button>
      </div>
      <div class="jp-toolbar-sep mobile-collapsible"></div>
      <div class="jp-toolbar-group mobile-collapsible">
        <button id="add-code-btn" class="jp-toolbar-pill">代码单元格</button>
        <button id="add-markdown-btn" class="jp-toolbar-pill">标记单元格</button>
        <button id="add-view-btn" class="jp-toolbar-pill">视图单元格</button>
        <button id="run-all-btn" class="jp-toolbar-pill accent">运行全部</button>
        <button id="restart-kernel-btn" class="jp-toolbar-pill">重启内核</button>
      </div>
      <div class="jp-toolbar-sep mobile-collapsible"></div>
      <div class="jp-toolbar-group grow-right">
        <button id="toggle-sidebar-btn" class="jp-toolbar-pill mobile-collapsible">收起侧边栏</button>
        <button id="mobile-toolbar-toggle" class="jp-toolbar-pill jp-mobile-toggle">折叠工具栏</button>
      </div>
    </section>

    <main id="main-layout" class="jp-main-layout">
      <aside id="sidebar" class="jp-sidebar">
        <div class="jp-sidebar-tabs">
          <button id="tab-files" class="jp-tab active" data-tab="files">文件</button>
          <button id="tab-running" class="jp-tab" data-tab="running">运行中</button>
        </div>
        <div class="jp-sidebar-tools">
          <button id="sidebar-collapse-btn" class="jp-mini-btn" title="折叠/展开侧边栏">◀</button>
          <button id="sidebar-new-btn" class="jp-mini-btn">新建</button>
          <button id="sidebar-refresh-btn" class="jp-mini-btn">刷新</button>
        </div>
        <section id="panel-files" class="jp-sidebar-panel active">
          <div id="notebook-list" class="jp-file-list"></div>
        </section>
        <section id="panel-running" class="jp-sidebar-panel">
          <div id="running-list" class="jp-running-list"></div>
        </section>
      </aside>

      <section class="jp-editor-area">
        <header class="jp-notebook-header">
          <div id="notebook-display-name" class="jp-notebook-name">未打开</div>
          <div class="jp-header-actions">
            <span class="jp-trusted">已信任</span>
          </div>
        </header>

        <section id="cells-container" class="jp-cells" aria-live="polite">
          <div class="jp-empty">请选择或创建一个笔记本。</div>
        </section>
      </section>
    </main>
  </div>

  <div class="jp-floating-dock" aria-label="悬浮快捷操作栏">
    <button id="floating-dock-toggle" class="jp-float-btn jp-float-toggle-btn" title="折叠/展开快捷栏" aria-label="折叠或展开快捷栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"></path>
      </svg>
    </button>
    <button class="jp-float-btn" data-float-action="settings" title="全局设置" aria-label="全局设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1 1 0 0 1 0 1.4l-1.1 1.1a1 1 0 0 1-1.4 0l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a1 1 0 0 1-1 1h-1.6a1 1 0 0 1-1-1v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a1 1 0 0 1-1.4 0l-1.1-1.1a1 1 0 0 1 0-1.4l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a1 1 0 0 1-1-1v-1.6a1 1 0 0 1 1-1h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a1 1 0 0 1 0-1.4l1.1-1.1a1 1 0 0 1 1.4 0l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4a1 1 0 0 1 1-1h1.6a1 1 0 0 1 1 1v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2a1 1 0 0 1 1 1v1.6a1 1 0 0 1-1 1h-.2a1 1 0 0 0-.9.6z"></path>
      </svg>
    </button>
    <button class="jp-float-btn" data-float-action="tools" title="快捷工具" aria-label="快捷工具">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15.1 6.1a3.5 3.5 0 0 0-4.9 4.9l-5.8 5.8a1.4 1.4 0 0 0 2 2l5.8-5.8a3.5 3.5 0 0 0 4.9-4.9l-2 2-2.9-.7-.7-2.9 2-2z"></path>
        <path d="M14.7 14.7l3.1 3.1"></path>
      </svg>
    </button>
    <button class="jp-float-btn" data-float-action="capture" title="截图/录屏" aria-label="截图录屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 8a2 2 0 0 1 2-2h2.2l1.2-2h5.2l1.2 2H18a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path>
        <circle cx="12" cy="12" r="3.2"></circle>
      </svg>
    </button>
    <button class="jp-float-btn" data-float-action="ai" title="AI 对话/语音" aria-label="AI 对话和语音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12h2l1.5-3 3 10 2.5-8 2 4h2"></path>
        <path d="M19 12h2"></path>
      </svg>
    </button>
    <button class="jp-float-btn" data-float-action="run" title="运行控制" aria-label="运行控制">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 6l10 6-10 6z"></path>
      </svg>
    </button>
  </div>

  <aside id="floating-panel" class="jp-floating-panel hidden" aria-live="polite" aria-label="悬浮操作面板">
    <div class="jp-floating-panel-head">
      <div id="floating-panel-title" class="jp-floating-panel-title">快捷面板</div>
      <button id="floating-panel-close" class="jp-floating-close" aria-label="关闭面板">✕</button>
    </div>
    <div id="floating-panel-body" class="jp-floating-panel-body"></div>
  </aside>

  <div id="toast" class="jp-toast" role="status" aria-live="polite"></div>

  <script src="./main.js"></script>
</body>
</html>
